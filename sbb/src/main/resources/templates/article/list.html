<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시글 리스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="mb-0">게시글 리스트</h1>
        <a href="/article/create" class="btn btn-primary">등록</a>
    </div>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(articles)}">
        등록된 게시글이 없습니다.
    </div>

    <table class="table table-hover align-middle" th:if="${!#lists.isEmpty(articles)}">
        <thead>
        <tr>
            <th scope="col">번호</th>
            <th scope="col">제목</th>
            <th scope="col">등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="article : ${articles}">
            <td th:text="${article.id}">1</td>
            <td>
                <a th:href="@{|/article/detail/${article.id}|}" th:text="${article.title}">게시글 제목</a>
            </td>
            <td th:text="${article.createdDate}">2025-05-09T10:20</td>
        </tr>
        </tbody>
    </table>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
</body>
</html>
