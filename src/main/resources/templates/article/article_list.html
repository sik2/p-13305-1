<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <table class="table">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일시</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="article : ${articleList}"
            th:onclick="|location.href='@{/article/detail/{id}(id=${article.id})}'|"
            style="cursor:pointer;">
            <td th:text="${article.id}"></td>
            <td th:text="${article.title}"></td>
            <td th:text="${#temporals.format(article.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <a href="/article/create" class="link-primary">
        Article 등록하기
    </a>


</div>

</body>
</html>
