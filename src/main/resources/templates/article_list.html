<h1>게시글 목록</h1>

<table>
    <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>생성일</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="article : ${articleList}">
            <td th:text="${article.id}"></td>
            <td>
                <a th:href="@{/article/detail/{id}(id=${article.id})}" th:text="${article.title}"></a>
            </td>
            <td th:text="${article.createDate}"></td>
        </tr>
    </tbody>
</table>

<button type="button" onclick="location.href='/article/create'">작성</button>
