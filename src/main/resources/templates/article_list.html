<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-3">

    <h2 class="mb-3">게시글 목록</h2>

    <table class="table table-hover">
        <thead class="table-dark">
        <tr>
            <th style="width: 80px;">번호</th>
            <th>제목</th>
            <th style="width: 160px;">작성일시</th>
        </tr>
        </thead>
        <tbody>

        <!--
            th:each="article, loop : ${articleList}"
            → Controller에서 model.addAttribute("articleList", ...) 로 전달한 리스트를 반복
            → article: 현재 반복 항목
            → loop: 반복 상태 (loop.count = 1부터 순번)
        -->
        <tr th:each="article, loop : ${articleList}">
            <td th:text="${loop.count}"></td>
            <td>
                <!--
                    th:href="@{|/article/detail/${article.id}|}"
                    → 클릭 시 /article/detail/1 처럼 해당 게시글 상세 페이지로 이동
                -->
                <a th:href="@{|/article/detail/${article.id}|}"
                   th:text="${article.title}">
                </a>
            </td>
            <td th:text="${#temporals.format(article.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
            <!--
                #temporals.format(): 날짜/시간을 보기 좋은 문자열로 변환
                'yyyy-MM-dd HH:mm' → 2025-04-30 14:30 형식
            -->
        </tr>

        </tbody>
    </table>

    <!-- 게시글 등록 버튼 -->
    <a th:href="@{/article/create}" class="btn btn-primary">등록</a>

</div>
</html>
