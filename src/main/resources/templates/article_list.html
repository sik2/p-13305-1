<h2>게시물 목록</h2>

<table>
    <tr>
        <th>번호</th>
        <th>제목</th>
    </tr>
    <tr th:each="article : ${articles}">
        <td th:text="${article.id}"></td>
        <td><a th:href="@{|/article/detail/${article.id}|}" th:text="${article.title}"></a></td>
    </tr>
</table>

<div>
    <a href="/article/create">게시글 작성</a>
</div>
