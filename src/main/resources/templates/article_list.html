<div id="article-list" class="container">
    <h1>Article List</h1>
    <table border="1" >
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성일시</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="article : ${articles}">
                <td th:text="${article.id}"></td>
                <td><a th:href="@{|/article/detail/${article.id}|}" th:text="${article.title}"></a></td>
                <td th:text="${#temporals.format(article.createdDate, 'yy-MM-dd HH:mm:ss')}"></td>
            </tr>
        </tbody>
    </table>
    <button onclick="window.location.href='/article/create'">게시물 등록</button>
</div>
