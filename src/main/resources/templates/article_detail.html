<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-3">

    <!-- 게시글 제목 -->
    <h2 class="border-bottom py-2" th:text="${article.title}"></h2>

    <!-- 작성일시 -->
    <div class="text-muted mb-3"
         th:text="${#temporals.format(article.createdDate, 'yyyy-MM-dd HH:mm')}">
    </div>

    <!-- 게시글 내용 -->
    <div class="card">
        <div class="card-body">
            <!--
                style="white-space: pre-line;"
                → textarea에 입력한 줄바꿈(\n)을 HTML에서도 줄바꿈으로 표시
            -->
            <div class="card-text" style="white-space: pre-line;"
                 th:text="${article.content}">
            </div>
        </div>
    </div>

    <!-- 목록으로 돌아가는 버튼 -->
    <div class="mt-3">
        <a th:href="@{/article/list}" class="btn btn-secondary">목록</a>
    </div>

</div>
</html>
