<!doctype html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout}">
<div layout:fragment="content" class="container py-4">
    <h2 class="mb-3" th:text="${article.title}"></h2>
    <div class="card mb-3">
        <div class="card-body">
            <div class="lh-lg" th:text="${article.content}" style="white-space: pre-line;"></div>
        </div>
    </div>
    <div class="text-muted small mb-3" th:text="${#temporals.format(article.createdDate, 'yyyy-MM-dd HH:mm')}"></div>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{'/article/modify/' + ${article.id}}"
           sec:authorize="isAuthenticated()"
           th:if="${article.author != null and #authentication.getPrincipal().getUsername() == article.author.username}">수정</a>
        <form th:action="@{'/article/delete/' + ${article.id}}" method="post" style="display:inline;"
              sec:authorize="isAuthenticated()"
              th:if="${article.author != null and #authentication.getPrincipal().getUsername() == article.author.username}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary btn-sm"
                    onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
        </form>
        <a class="btn btn-secondary btn-sm" th:href="@{/article/list}">목록</a>
    </div>
</div>
</html>
