<!doctype html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<div layout:fragment="content" class="container py-4">
<h2 class="mb-3" th:text="${article.title}"></h2>
<div class="card mb-3">
    <div class="card-body">
        <div class="lh-lg" th:text="${article.content}" style="white-space: pre-line;"></div>
    </div>
</div>
<div class="text-muted small mb-3" th:text="${#temporals.format(article.createdDate, 'yyyy-MM-dd HH:mm')}"></div>
<div>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/article/list}">목록</a>
</div>
</div>
</html>
