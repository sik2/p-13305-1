<!doctype html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<div layout:fragment="content" class="container py-4">
    <div class="col-lg-8">
        <h2 class="mb-3" th:text="${articleId != null} ? '게시글 수정' : '게시글 등록'">게시글 등록</h2>
        <form class="card card-body shadow-sm"
              th:action="${articleId != null} ? @{'/article/modify/' + ${articleId}} : @{/article/create}"
              th:object="${articleForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div th:replace="~{form_errors :: articleErrorsFragment}"></div>
            <div class="mb-3">
                <label for="title" class="form-label">제목</label>
                <input id="title" type="text" th:field="*{title}" class="form-control">
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">내용</label>
                <textarea id="content" th:field="*{content}" rows="8" class="form-control"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-secondary">저장하기</button>
                <a th:href="${articleId != null} ? @{'/article/detail/' + ${articleId}} : @{/article/list}"
                   class="btn btn-outline-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
</html>
