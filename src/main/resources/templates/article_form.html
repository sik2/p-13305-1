<!doctype html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<div layout:fragment="content" class="container py-4">
    <div class="col-lg-8">
<h2 class="mb-3">게시글 등록</h2>
<form class="card card-body shadow-sm" th:action="@{/article/create}" th:object="${articleForm}" method="post">
    <div class="mb-3">
        <label for="title" class="form-label">제목</label>
        <input id="title" type="text" th:field="*{title}" class="form-control">
    </div>
    <div class="mb-3">
        <label for="content" class="form-label">내용</label>
        <textarea id="content" th:field="*{content}" rows="8" class="form-control"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">저장하기</button>
</form>
    </div>
</div>
</html>
