<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">

    <div class="page-header">
        <h1>📋 게시글 목록</h1>
        <a th:href="@{/article/create}" class="btn btn-primary">+ 등록</a>
    </div>

    <div class="card">
        <table th:if="${#lists.size(articles) > 0}">
            <thead>
                <tr>
                    <th style="width: 80px;">번호</th>
                    <th>제목</th>
                    <th style="width: 120px;">작성자</th>
                    <th style="width: 160px;">작성일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="article : ${articles}"
                    th:onclick="|location.href='@{/article/detail/{id}(id=${article.id})}'|">
                    <td><span class="badge-id" th:text="${article.id}"></span></td>
                    <td class="title-cell">
                        <a th:href="@{/article/detail/{id}(id=${article.id})}"
                           th:text="${article.title}"></a>
                    </td>
                    <td th:text="${article.author}"></td>
                    <td th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
            </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.size(articles) == 0}">
            <p>등록된 게시글이 없습니다.</p>
            <p style="font-size: 13px;">첫 게시글을 등록해보세요!</p>
        </div>
    </div>

</div>
</body>
</html>
