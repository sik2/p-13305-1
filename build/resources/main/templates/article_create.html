<h2>게시글 작성 폼</h2>
<div>
    <form method="POST" action="/article/insert">
        <input type="text"
               name="title"
               id="title"
               placeholder="제목을 입력하세요"
        >
        <input type="text"
                name="content"
                id="content"
                placeholder="내용을 입력하세요">
        <button type="submit">작성</button>
    </form>
</div>
