<div>
    <span th:value="${article}">
        <h2 th:text="${article.title}"></h2>
        <h4 th:text="${article.content}"></h4>
        <p th:text="${article.createDate}"></p>
    </span>
    <a th:href="@{|/article/modify/${id}|}">수정</a>
    <form method="POST" th:action="@{|/article/delete/${article.id}|}">
        <button type="submit">삭제</button>
    </form>
</div>
<div>
    <a href="/article/list">목록으로</a>
</div>
